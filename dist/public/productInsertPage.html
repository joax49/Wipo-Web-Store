<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styling/productInsertPage.css">
        <link rel="stylesheet" href="styling/navBar.css">
        <link rel="stylesheet" href="styling/modalWindow.css">
        <title>Document</title>
    </head>
    <body>
        <dialog>
            <div id="modal__content">
                <h2 id="modal__title">Inserte el código de administrador</h2>
                <h4 id="modal__answer"></h4>
                <form id="modal__form">
                    <input id="modal__password" type="text" required>
                    <input id="modal__submit" type="submit">
                </form>
                <form method="dialog">
                    <button id="modal__close-button">X</button>
                </form>
            </div>
        </dialog>
        <nav id="nav">
            <ul id="nav__ul">
                <li class="nav__item"><a href="http://localhost:3000" class="nav__link">Ver productos</a></li>
                <li class="nav__item"><a href="http://localhost:3000/productInsertPage" class="nav__link">Añadir productos</a></li>
                <li class="nav__item"><a href="http://localhost:3000/productEditorPage" class="nav__link">Editar productos</a></li>
                <li class="nav__item"><a href="http://localhost:3000/salesDisplayPage" class="nav__link">Ver ventas</a></li>
                <li class="nav__item"><a href="" class="nav__link">Log in</a></li>
            </ul>
        </nav>
        <main>
            <div>
                <h3 id="last-id-indicator"></h3>
            </div>
            <div class="form_container">
                <form id="newProduct" enctype="multipart/form-datas">
                    <label for="productName">Añadir producto</label>
                    <input type="text" id="productName" placeholder="Producto" name="productName" class="non-submit" required>
                    <input type="number" id="productPrice" placeholder="Precio" name="productPrice" class="non-submit" required>
                    <input type="text" id="productType" placeholder="Type" name="productType" class="non-submit" required>
                    <input type="text" id="productSubtype" placeholder="Subtype" name="productSubtype" class="non-submit" required>
                    <input type="number" id="productAmount" placeholder="Amount" name="productAmount" class="non-submit" required>
                    <input type="file" id="productFile" name="image" class="image-input" required>
                    <input type="submit" id="submitProduct" class="submit">
                </form>
            </div>
        </main>
        <script type="module" src="modalWindow.js"></script>
        <script type="module" src="productForm.js"></script>
        <script type="module" src="cart.js"></script>
    </body>
</html>
